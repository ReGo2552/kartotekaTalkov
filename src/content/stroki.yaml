# Строки из песен для карточек ящика «П».
# Песни идут по алфавиту. Ключ слева — имя файла карточки, его не менять.
# Пустые кавычки — карточка без цитаты.
#
# Одна строка пишется в кавычках:  stroka: "Скажи, откуда ты взялась?.."
# Две строки — после «|-», каждая с новой строки и с отступом в 4 пробела:
#   stroka: |-
#     Летний дождь, летний дождь,
#     Начался сегодня рано
# В кавычках YAML склеивает строки через пробел, поэтому для переносов только «|-».

love-you:
  title: "Love You"
  stroka: "Love you! I love you! Что означает: «Я тебя люблю!»"

a-teper-my-s-toboy-pritikhli:
  title: "А теперь мы с тобой притихли"
  stroka: |-
    К неудачам давно привыкли,
    А удачи пугают нас.

bal-satany:
  title: "Бал Сатаны"
  stroka: |-
    Сатана гулять устал,
    Гаснут свечи, кончен бал.

ballada-ob-afgantse:
  title: "Баллада об афганце"
  stroka: ""

byvshiy-podesaul:
  title: "Бывший подъесаул"
  stroka: |-
    Бывший подъесаул уходил воевать;
    На проклятье отца и молчание брата

vek-mamay:
  title: "Век Мамай"
  stroka: ""

voyna:
  title: "Война"
  stroka: |-
    Как тут будет петься про аккордеон
    И про берег детства, если взорван он

vsemu-svoyo-vremya:
  title: "Всему своё время"
  stroka: ""

garmoniya:
  title: "Гармония"
  stroka: ""

globus:
  title: "Глобус"
  stroka: |-
    Покажите мне такую страну, где славят тирана,
    Где победу в войне над собой отмечает народ.

gospoda-demokraty:
  title: "Господа демократы"
  stroka: |-
    Вот так! Вот так! Живут Америка с Европой.
    Вот так! Вот так! Ну а у нас всё через ж…

gospodin-prezident:
  title: "Господин президент"
  stroka: |-
    Господин президент, назревает инцидент:
    Мы устали от вранья, в небе — тучи воронья.

den-vospominaniy:
  title: "День воспоминаний"
  stroka: ""

den-rozhdeniya:
  title: "День рождения"
  stroka: ""

druzya-tovarishchi:
  title: "Друзья-товарищи"
  stroka: |-
    Ох уж эти мне друзья-товарищи,
    Всё, всё, всё, всё знающие…

dyadin-kolpak:
  title: "Дядин колпак"
  stroka: |-
    Мы в колпаках и под «колпаком»
    Ходили строем и слагали песни

zaiskivanie:
  title: "Заискивание"
  stroka: ""

zamknutyy-krug:
  title: "Замкнутый круг"
  stroka: |-
    Мы с тобой никак не можем
    Разобраться, что к чему…

zvezda:
  title: "Звезда"
  stroka: |-
    Ты светишь себе, себе и только,
    Холодный твой свет не греет нисколько, Звезда.

kogda-zasypaet-gorod:
  title: "Когда засыпает город"
  stroka: ""

kpss:
  title: "КПСС"
  stroka: |-
    Страна не сможет встать с колен, покуда на плечах
    Зверь восседает у неё — КПСС

kremlyovskaya-stena:
  title: "Кремлёвская стена"
  stroka: |-
    Я ронял бы, ронял бы кирпичики,
    Помогая тем самым отстаивать…

letniy-dozhd:
  title: "Летний дождь"
  stroka: |-
    Летний дождь, летний дождь,
    Начался сегодня рано

lyudi-s-zabintovannymi-lbami:
  title: "Люди с забинтованными лбами"
  stroka: |-
    И доживают с забинтованными лбами
    В расцвете лет, в расцвете лет.

malenkaya-planeta:
  title: "Маленькая планета"
  stroka: |-
    В окружении стай вездесущих ракет
    Так нелегко вращаться…

malenkiy-gorod:
  title: "Маленький город"
  stroka: |-
    Маленький город, маленький город,
    Ты обо мне скучаешь…

metamorfoza:
  title: "Метаморфоза"
  stroka: "Метаморфоза…"

mechta:
  title: "Мечта"
  stroka: ""

mister-x:
  title: "Мистер X"
  stroka: ""

mne-nemnogo-zhal:
  title: "Мне немного жаль"
  stroka: ""

moy-brat:
  title: "Мой брат"
  stroka: ""

moya-lyubov:
  title: "Моя любовь"
  stroka: "Скажи, откуда ты взялась?.."

nasha-zhizn:
  title: "Наша жизнь"
  stroka: ""

nervy-nervy-nervy:
  title: "Нервы, нервы, нервы"
  stroka: ""

novaya-doroga:
  title: "Новая дорога"
  stroka: ""

nostalgiya:
  title: "Ностальгия"
  stroka: |-
    Ностальгия, ностальгия,
    Нас там больше нет…

okean-neponimaniya:
  title: "Океан непонимания"
  stroka: |-
    Понимаешь, но не знаешь,
    Где найдёшь, где потеряешь…

otkuda-ty-prishyol:
  title: "Откуда ты пришёл"
  stroka: ""

pamyati-viktora-tsoya:
  title: "Памяти Виктора Цоя"
  stroka: |-
    Они уходят, выполнив заданье,
    Их отзывают Высшие Миры…

pamyat:
  title: "Память"
  stroka: "Вот и опять я с тобою и без тебя…"

pozdno:
  title: "Поздно"
  stroka: ""

poluglasnost:
  title: "Полугласность"
  stroka: ""

pochemu-my-stali-chuzhimi:
  title: "Почему мы стали чужими"
  stroka: ""

pravo-vsem-dano:
  title: "Право всем дано"
  stroka: ""

prazdnik:
  title: "Праздник"
  stroka: |-
    День, день и ночь, ночь и день ожидал,
    Я всегда ожидал эту встречу…

prizvanie:
  title: "Призвание"
  stroka: ""

primernyy-malchik:
  title: "Примерный мальчик"
  stroka: |-
    Нет мудрее педагога,
    Чем наша собственная жизнь.

proshchalnyy-den:
  title: "Прощальный день"
  stroka: ""

razgovory-ni-o-chyom:
  title: "Разговоры ни о чём"
  stroka: ""

revolyutsionnaya-lambada:
  title: "Революционная ламбада"
  stroka: ""

rodina-moya:
  title: "Родина моя"
  stroka: |-
    То слёзы льют твои великие сыны
    С небес, с небес…

rossiya:
  title: "Россия"
  stroka: |-
    Как тяжело тебя читать
    Обманутому поколенью…

ryzhiy:
  title: "Рыжий"
  stroka: ""

sakvoyazh:
  title: "Саквояж"
  stroka: |-
    А в потайном кармашке спрячьте
    Вы надежду на успех.

samyy-luchshiy-den:
  title: "Самый лучший день"
  stroka: |-
    Всё, что было с нами, можешь взять с собой
    И хранить до первой встречи.

samyy-yagodnyy-sezon:
  title: "Самый ягодный сезон"
  stroka: ""

sobranie-v-zheke:
  title: "Собрание в ЖЭКе"
  stroka: ""

sovki:
  title: "Совки"
  stroka: |-
    Они не любят, не страдают, не ищут,
    Не напрягают мозги.

solntse-ukhodit-na-zapad:
  title: "Солнце уходит на запад"
  stroka: "Я попрощаюсь с ними молча, навсегда…"

spasatelnyy-krug:
  title: "Спасательный круг"
  stroka: |-
    Ты держи меня, не дай утонуть —
    Океан грозит бедою…

stop-dumayu-sebe:
  title: "Стоп! Думаю себе"
  stroka: |-
    Перестроились, ублюдки, во мгновенье ока,
    И пока они у трона, грош цена всем нам.

strana-detstva:
  title: "Страна детства"
  stroka: ""

strannitsa-v-nochi:
  title: "Странница в ночи"
  stroka: ""

studencheskaya-pesnya:
  title: "Студенческая песня"
  stroka: ""

stsena:
  title: "Сцена"
  stroka: ""

tanya:
  title: "Таня"
  stroka: |-
    А сегодня я забросил все дела,
    Потому, что ты меня завела!

tyomnaya-loshadka:
  title: "Тёмная лошадка"
  stroka: ""

tovarishch-lenin:
  title: "Товарищ Ленин, а как у вас дела в аду?.."
  stroka: ""

tri-doma:
  title: "Три дома"
  stroka: ""

tri-pisma:
  title: "Три письма"
  stroka: ""

ty-opozdala:
  title: "Ты опоздала"
  stroka: |-
    Не смотри на меня с печалью,
    Час прощанья пробит.

u-tvoego-okna:
  title: "У твоего окна"
  stroka: |-
    Я всё боялся опоздать в страну
    С названием «любовь».

uedu:
  title: "Уеду"
  stroka: |-
    И вот пришёл отчасти и посмотрел вокруг,
    Но ожидаемого счастья не обнаружил вдруг.

fatalnaya-kolesnitsa:
  title: "Фатальная колесница"
  stroka: |-
    Но думаю, что не улучшу твоё настроенье,
    Если своё впечатленье о жизни скажу…

chas-do-rassveta:
  title: "Час до рассвета"
  stroka: ""

chistye-prudy:
  title: "Чистые пруды"
  stroka: |-
    У каждого из нас на свете есть места,
    Что нам за далью лет всё ближе, всё дороже.

chudak:
  title: "Чудак"
  stroka: ""

etot-mir:
  title: "Этот мир"
  stroka: |-
    Этот мир несовершенный
    Состоит из всех из нас.

etot-put:
  title: "Этот путь"
  stroka: ""

ya-vernus:
  title: "Я вернусь"
  stroka: |-
    И не видно конца и края
    Этой войне.
