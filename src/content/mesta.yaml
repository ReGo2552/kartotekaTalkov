# Места на карте. num — номер на карте, в порядке жизни. Ключ слева — имя места латиницей, его не менять.
# Координаты — широта и долгота из OpenStreetMap. see — карточки, где о месте рассказано.

gretsovka:
  num: 1
  title: "Грецовка"
  where: "Щёкинский район Тульской области"
  years: "1956"
  text: "Здесь 4 ноября 1956 года родился Игорь Тальков."
  lat: 53.9882
  lon: 37.5049
  see: ["bio/shchekino"]

shchekino:
  num: 2
  title: "Щёкино"
  where: "Тульская область"
  years: "1956–1976"
  text: "Школа № 11, которая теперь носит его имя, музыкальная школа по классу баяна, ПТУ № 6. С 2017 года в городе стоит памятник Талькову."
  lat: 54.0045
  lon: 37.5179
  see: ["bio/shchekino", "pages/memory"]

tula:
  num: 3
  title: "Тула"
  where: "Тульский педагогический институт"
  years: "после школы"
  text: "Учился на физико-техническом факультете педагогического института, но не окончил его."
  lat: 54.193
  lon: 37.6175
  see: ["bio/poiski"]

nakhabino:
  num: 4
  title: "Нахабино"
  where: "Московская область"
  years: "армия"
  text: "Служил в инженерных войсках, собрал там ансамбль «Звёздочка»."
  lat: 55.8395
  lon: 37.1771
  see: ["bio/poiski"]

sochi:
  num: 5
  title: "Сочи"
  where: "гостиница «Жемчужина»"
  years: "после армии"
  text: "Играл на бас-гитаре в варьете гостиницы, в группе, где пел Александр Барыкин."
  lat: 43.5708
  lon: 39.7317
  see: ["bio/poiski"]

leningrad:
  num: 6
  title: "Ленинград"
  where: "Санкт-Петербург"
  years: "1978–1989"
  text: "Первая запись на гибкой пластинке «Поют ленинградцы», песни с композитором Яковом Дубравиным, клип «Кремлёвская стена» Ленинградского телевидения."
  lat: 59.939
  lon: 30.3154
  see: ["albums/poyut-leningradtsy", "people/dubravin", "bio/spasatelnyy-krug"]

luzhniki:
  num: 7
  title: "Лужники"
  where: "Москва"
  years: "23 февраля 1991"
  text: "Концерт Талькова и «Спасательного круга». Запись вышла на пластинках в 1992 году."
  lat: 55.7157
  lon: 37.5538
  see: ["albums/luzhniki-1991", "bio/sud"]

teatr-estrady:
  num: 8
  title: "Театр эстрады"
  where: "Москва, Берсеневская набережная"
  years: "май 1991"
  text: "Здесь записан музыкальный спектакль «Суд». Записи вышли уже после гибели автора."
  lat: 55.7448
  lon: 37.6113
  see: ["albums/sud", "bio/sud"]

yubileynyy:
  num: 9
  title: "«Юбилейный»"
  where: "Санкт-Петербург, Дворец спорта"
  years: "6 октября 1991"
  text: "За кулисами концерта во Дворце спорта Игорь Тальков был убит. На здании — мемориальная доска."
  lat: 59.9503
  lon: 30.292
  see: ["pages/death", "pages/memory"]

vagankovo:
  num: 10
  title: "Ваганьковское кладбище"
  where: "Москва"
  years: "с 1991"
  text: "Могила Игоря Талькова."
  lat: 55.7682
  lon: 37.5484
  see: ["pages/memory"]

muzey:
  num: 11
  title: "Музей Игоря Талькова"
  where: "Москва, Черниговский переулок"
  years: "1993–2019"
  text: "Музей открылся 5 марта 1993 года: личные вещи, рукописи, сценические костюмы, баян и гитара. В 2019 году он лишился помещения, коллекцию приняла на хранение гимназия «Эллада»."
  lat: 55.7447
  lon: 37.6267
  see: ["pages/memory"]
